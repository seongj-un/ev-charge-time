services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: evcharge
      POSTGRES_PASSWORD: evcharge
      POSTGRES_DB: evcharge
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U evcharge"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
