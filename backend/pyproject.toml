[project]
name = "evcharge"
version = "0.1.0"
description = "EV 충전 최적 시간 추천 백엔드"
requires-python = ">=3.13,<3.14"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic-settings>=2.6",
    "pyyaml>=6.0",
    "sqlalchemy>=2.0",
    "alembic>=1.14",
    "psycopg[binary]>=3.2",
    "argon2-cffi>=25.1.0",
    "pydantic[email]>=2.13.5",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "httpx>=0.28",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/evcharge"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
