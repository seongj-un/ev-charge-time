# 전기요금 설정.
#
# ★ 1차 자료 두 건. 같은 폴더에 원문 PDF를 함께 둔다.
#   (A) 20260414(mcee-tou).pdf  ← **현행 기준**
#       기후에너지환경부 보도자료 2026-04-14 「낮엔 낮추고 저녁은 높인다」.
#       붙임 3 「전기자동차 충전전력요금 현황」에 2026-04-16 시행 시간대 구분과
#       자가소비용 단가표가 있다.
#   (B) 20231109(total).pdf
#       한국전력공사 「전기요금(종합)」 2023-11-09 시행 — 개편 전 기준.
#
# 2026-09-22 대조: (A)의 자가소비용 단가 12개가 (B)와 한 자리도 다르지 않다.
# 2026-04-16 개편에서 **바뀐 것은 시간대 구분뿐이고 EV 충전전력 단가는 그대로**다
# (보도자료 본문의 단가 조정은 적용대상이 산업용(을)이다).
#
# 개정되면 value와 source의 시행일만 고치면 된다 — 코드는 건드리지 않는다.
#
# status 의미:
#   verified   — 위 공식 요금표에서 그대로 옮긴 값
#   derived    — 공식 값에서 계산해 얻은 값
#   unverified — 아직 공식 근거를 못 찾은 값
#
# /health 와 /api/recommend 응답의 unverified_tariff_items 는 이 파일을 훑어
# status != verified 인 항목을 모아 만든다. 목록을 코드에 박지 않는 이유는
# 그러면 요금표를 확인할 때마다 두 곳을 고쳐야 하고 반드시 어긋나기 때문이다.

version: "2026.04.16-mcee+fund2.7"

# ── 계절 구분 (보도자료 붙임 3, 3. 계절·시간대별 구분) ───────────────────
seasons:
  value:
    summer: [6, 7, 8]
    spring_fall: [3, 4, 5, 9, 10]
    winter: [11, 12, 1, 2]
  source: "기후에너지환경부 보도자료 2026-04-14 「낮엔 낮추고 저녁은 높인다」 붙임 3, 3. 계절·시간대별 구분 (2026-04-16 시행). 개편 전 한전 요금표와 동일"
  status: verified

# ── 평일 시간대별 부하구간 (보도자료 붙임 3, 3. 계절·시간대별 구분) ──────
# [시작시, 끝시) 반열린 구간.
#
# 2026-04-16 개편으로 여름·봄가을이 바뀌었다 (겨울은 그대로):
#   중간부하 08–11·12–13·18–22  →  08–15·21–22
#   최대부하 11–12·13–18        →  15–21
# 저녁 18–21시가 중간부하에서 최대부하로 올라가고, 낮 11–15시가 내려온다.
#
# 각주: 제주특별자치도는 시간대 구분이 다르다 (경부하 22–08, 중간부하 08–16,
# 최대부하 16–22). 이 서비스는 전남 기준이라 지금은 쓰지 않는다.
#
# 토요일·공휴일 계산기준(임시공휴일 제외) — 개편 전후 동일:
#   토요일 : 최대부하 시간대의 사용전력량 → 중간부하 시간대로 계량
#   공휴일 : 최대수요전력 및 사용전력량 → 경부하 시간대로 계량
# 판정 순서 구현은 domain/calendar.py 에 있다.
time_bands:
  value:
    # 여름철과 봄·가을철은 붙임 3 표에서 셀이 병합돼 같은 값이다.
    spring_fall:
      light: [[22, 24], [0, 8]]
      middle: [[8, 15], [21, 22]]
      peak: [[15, 21]]
    summer:
      light: [[22, 24], [0, 8]]
      middle: [[8, 15], [21, 22]]
      peak: [[15, 21]]
    # 겨울철은 개편 전후가 같다.
    winter:
      light: [[22, 24], [0, 8]]
      middle: [[8, 9], [12, 16], [19, 22]]
      peak: [[9, 12], [16, 19]]
  source: "기후에너지환경부 보도자료 2026-04-14 「낮엔 낮추고 저녁은 높인다」 붙임 3, 3. 계절·시간대별 구분 (산업용(을)·EV 충전전력 기준, 2026-04-16 시행)"
  status: verified

# ── 전력량요금 (원/kWh) ──────────────────────────────────────────────────
# 요금표 2쪽 "전기자동차 충전전력요금(자가소비용)".
# 기본요금(저압 2,390 / 고압 2,580 원/kW)은 기능 명세 F-03 가정대로 제외한다 —
# 이 서비스는 "언제 충전할지"에 답하므로 시각에 따라 달라지지 않는 월 고정비는
# 추천 결과를 바꾸지 않는다.
energy_charge:
  self_low:
    value:
      summer: {light: 84.3, middle: 172.0, peak: 259.2}
      spring_fall: {light: 85.4, middle: 97.2, peak: 102.1}
      winter: {light: 107.4, middle: 154.9, peak: 217.5}
    source: "기후에너지환경부 보도자료 2026-04-14 「낮엔 낮추고 저녁은 높인다」 붙임 3, 1. 자가소비용 요금표 저압 (= 한전 전기요금(종합) 2023-11-09 2쪽과 같다 — 개편에서 단가는 바뀌지 않았다)"
    status: verified
  self_high:
    value:
      summer: {light: 79.2, middle: 137.4, peak: 190.4}
      spring_fall: {light: 80.2, middle: 91.0, peak: 94.9}
      winter: {light: 96.6, middle: 127.7, peak: 165.5}
    source: "기후에너지환경부 보도자료 2026-04-14 「낮엔 낮추고 저녁은 높인다」 붙임 3, 1. 자가소비용 요금표 고압 (= 한전 전기요금(종합) 2023-11-09 2쪽과 같다 — 개편에서 단가는 바뀌지 않았다)"
    status: verified

# ── kWh당 가산 항목 (요금표 1쪽 "전기요금 구조") ─────────────────────────
adders:
  climate_env_per_kwh:
    value: 9.0
    source: "한전 전기요금(종합) 2023-11-09, 1쪽 기후환경요금단가 (2023년 1월 기준, 매년 변동)"
    status: verified
  fuel_adjustment_per_kwh:
    value: 5.0
    source: "한전 전기요금(종합) 2023-11-09, 1쪽 연료비조정단가 (2023년 4분기 기준, 매 분기 변동, 상하한 ±5원/kWh)"
    status: verified

# ── 세금·기금 (요금표 1쪽 "청구금액 = 전기요금 + 부가가치세 + 전력산업기반기금") ──
vat_rate:
  value: 0.1
  source: "한전 전기요금(종합) 2023-11-09, 1쪽 — 전기요금 × 10%"
  status: verified

# 요금표 PDF(2023-11-09)에는 3.7%로 적혀 있지만 그 뒤 두 번 내려갔다:
# 3.7% → 3.2%(2024-07) → 2.7%(2025-07). PDF 값을 그대로 쓰면 자가 충전 비용과
# 절감액이 약 1%씩 부풀려진다.
power_fund_rate:
  value: 0.027
  source: "기획재정부 2024-07-23 정책브리핑 '(기존) 3.7% → (2024년 7월~) 3.2% → (2025년 7월~) 2.7%' (https://www.korea.kr/news/policyNewsView.do?newsId=148931755)"
  status: verified

# ── 공공 급속 ────────────────────────────────────────────────────────────
# 공공 급속 충전 단가는 한전 요금표가 정하지 않는다 — 충전사업자가 각자 정한다.
# (요금표 2쪽의 "전기자동차 충전전력요금(충전서비스 제공사업자용)"은 사업자가
#  한전에서 전기를 사올 때의 요금이지, 사업자가 소비자에게 받는 단가가 아니다.)
public_fast:
  base_price_per_kwh:
    value: 0.0
    source: "사업자별 상이 — 요청의 public_base_price 또는 이 설정값으로 주입.
      보도자료 본문 ❸ '일부 민간 충전 사업자도 동참할 예정'이 이 값이 하나로
      정해지지 않는다는 것을 뒷받침한다. 환경부 운영 충전기 단가표는 별도 확인 필요"
    status: unverified
  weekend_discount:
    value:
      saturday: 48.6
      sunday_holiday: 42.7
    source: "기후에너지환경부 보도자료 2026-04-14 「낮엔 낮추고 저녁은 높인다」 3쪽 본문 ❷ — '토요일 11~14시에는 킬로와트시당 48.6원,
      일요일·공휴일에는 42.7원이 할인'. 2026-04-18 시행.
      자가소비용 저압 봄·가을 중간부하 97.2 × 50% = 48.6,
      경부하 85.4 × 50% = 42.7 과 정확히 일치한다"
    status: verified

# ── 봄·가을 주말 할인 (자가소비용) ───────────────────────────────────────
# 보도자료가 같은 내용을 두 곳에서 말한다:
#   붙임 3 머리말 "봄·가을 주말·휴일 11~14시(경부하 또는 중간부하)에
#                 전력량요금 50% 할인 적용"
#   3쪽 각주     "3~5월, 9~10월 주말·공휴일 11~14시, 전력량요금의 50% 할인"
weekend_discount_self:
  value:
    multiplier: 0.5      # 전력량요금에만 곱한다
    hours: [11, 14]      # [시작시, 끝시)
    seasons: ["spring_fall"]
  source: "기후에너지환경부 보도자료 2026-04-14 「낮엔 낮추고 저녁은 높인다」 붙임 3 머리말 및 3쪽 본문 각주 (2026-04-18 시행)"
  status: verified

# 할인이 언제까지인지는 보도자료가 말하지 않는다. 기능 명세서만 2030년을 적어
# 뒀고 근거를 찾지 못했다. 지우면 할인이 영구가 되고, 위 항목에 끼워 두면
# 확인된 척이 되므로 **따로 떼어 미확인으로 남긴다.**
weekend_discount_sunset:
  value:
    until_year: 2030
  source: "기능 명세서 F-02 (근거 문서 미확보 — 일몰 연도만 확인되지 않았다)"
  status: unverified
