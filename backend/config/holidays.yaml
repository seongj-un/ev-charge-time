# 법정공휴일 목록.
#
# 기능 명세서 F-02의 부하구간 판정 1순위가 "일요일·공휴일"인데 두 명세서
# 어디에도 공휴일 데이터 출처가 없어 여기에 직접 둔다. 나중에 공공데이터포털
# 특일 정보 API로 교체할 때는 HolidayProvider 구현만 갈아끼우면 되고
# domain/calendar.py는 그대로다.
#
# 확인 필요: 음력 기반 공휴일(설날·부처님오신날·추석)과 대체공휴일은
# 공공데이터포털 특일 정보 API로 대조할 것.
#
# 2027년은 우주항공청 「2027년도 월력요항」(2026-06-29 발표)을 옮겼다.
# 노동절·제헌절은 공휴일법 개정(2026-04 지정)으로 2026년부터 공휴일이다.
#
# years: 이 파일이 "빠짐없이" 담고 있는 연도. 여기 없는 연도의 날짜는
# 공휴일이 없는 것으로 보지 않고 계산을 거절한다(평일 요금으로 조용히 틀리지
# 않게). 새 연도를 넣을 때는 날짜와 함께 years에도 추가한다.

version: "2027-kasa"

years: [2026, 2027]

