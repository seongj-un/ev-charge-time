# 키네틱 배포 스택.
#
# 한 번에 넷이 뜬다: Postgres → 백엔드(FastAPI) → 프론트(Next) → Caddy.
# 브라우저는 Caddy만 본다. 프론트의 rewrite가 /api/*를 백엔드로 넘기므로
# 브라우저 입장에서는 전부 같은 출처이고, httpOnly 세션 쿠키가 그냥 실린다.
#
#   docker compose -f docker-compose.prod.yml up -d --build
#
# 값은 같은 디렉터리의 .env에서 읽는다 (.env.deploy.example 참고).
# 도메인이 없으면 SITE_ADDRESS를 비워 두면 된다 — Caddy가 80포트로 그냥 뜬다.

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-evcharge}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD를 .env에 넣으세요}
      POSTGRES_DB: ${POSTGRES_DB:-evcharge}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-evcharge}"]
      interval: 5s
      timeout: 3s
      retries: 10
    # 포트를 밖으로 열지 않는다. 같은 네트워크 안에서만 닿으면 된다.

  backend:
    build:
      context: ./backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      # DATABASE_URL을 여기서 조립하지 않는다. 비밀번호에 `@`·`/`·`%` 등이 있으면
      # URL이 깨지므로 조각으로 넘기고, 앱(settings.py)이 인코딩해서 만든다.
      POSTGRES_USER: ${POSTGRES_USER:-evcharge}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-evcharge}
      POSTGRES_HOST: db
      # HTTPS로 서비스할 때만 true. HTTP인데 켜면 쿠키가 아예 안 실려
      # 로그인이 조용히 실패한다.
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      # 없으면 해당 기능만 501이고 나머지는 그대로 돈다.
      CHARGER_API_KEY: ${CHARGER_API_KEY:-}
      CHARGER_ZCODES: ${CHARGER_ZCODES:-12}
      KMA_API_KEY: ${KMA_API_KEY:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-3.1-flash-lite}
      CHAT_RATE_LIMIT_COUNT: ${CHAT_RATE_LIMIT_COUNT:-20}
      CHAT_RATE_LIMIT_WINDOW_MINUTES: ${CHAT_RATE_LIMIT_WINDOW_MINUTES:-60}
      SOLAR_CAPACITY_MW: ${SOLAR_CAPACITY_MW:-}
      SOLAR_CAPACITY_SOURCE: ${SOLAR_CAPACITY_SOURCE:-}

  frontend:
    build:
      context: ./frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    environment:
      # 컨테이너 이름으로 찾는다. 브라우저가 아니라 Next 서버가 치는 주소다.
      BACKEND_URL: http://backend:8000

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      - frontend
    ports:
      - "80:80"
      - "443:443"
    environment:
      # 도메인을 넣으면 Caddy가 인증서를 알아서 받아 HTTPS로 서비스한다.
      # 비워 두면 :80 으로 뜬다 (IP 접속용).
      SITE_ADDRESS: ${SITE_ADDRESS:-:80}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  pgdata:
  caddy_data:
  caddy_config:
